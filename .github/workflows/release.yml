name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (must match the version in pom.xml)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${{ inputs.version }}"
          else
            tag="${{ github.ref_name }}"
          fi
          pom=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          # The tag and the version in the pom have to agree, or the jar inside the release would
          # be named something other than the release itself.
          if [ "${tag#v}" != "$pom" ]; then
            echo "::error::tag $tag does not match the project version $pom in pom.xml"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pom=$pom" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $(git rev-parse --short HEAD)"

      - name: Build
        run: mvn -B -ntp clean package

      - name: Inspect the shaded jar
        run: |
          set -euo pipefail
          jar=$(ls target/PrivacyCoords-*.jar)
          unzip -p "$jar" plugin.yml > plugin.yml.built
          fail() { echo "::error::$1"; exit 1; }
          grep -q "^main: dev.faboit.privacycoords.PrivacyCoordsPlugin$" plugin.yml.built \
            || fail "plugin.yml is not ours"
          grep -q "^folia-supported: true$" plugin.yml.built || fail "folia-supported is missing"
          grep -q "^version: ${{ steps.version.outputs.pom }}$" plugin.yml.built \
            || fail "plugin.yml version does not match the pom"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          notes=$(mktemp)
          cat > "$notes" <<'NOTES'
          Randomised coordinates for Minecraft servers: a player with PrivacyCoords enabled sees
          their whole world shifted by a random amount, so pressing F3 on stream shows coordinates
          that have nothing to do with where their base actually is.

          The shift lives entirely on the network layer. Every position the server sends that player
          is moved by `+offset` and everything they send back is moved by `-offset`, so blocks,
          entities, sounds, the world border and the compass all move together and the world behaves
          exactly as it always did. Other players are unaffected.

          **Install:** drop the jar into `plugins/` and start the server. PacketEvents is bundled and
          relocated, so there is nothing else to install.

          Runs on Spigot, Paper, Folia and Folia forks such as CanvasMC. Requires Java 17 or newer.

          Enable it with `/privacycoords enable`; every part of the plugin is configurable in
          `config.yml`. See the [README](https://github.com/Faboit1/PrivacyCoords#readme) for the
          commands, the configuration and the known limitations.
          NOTES

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" target/PrivacyCoords-*.jar --clobber
          else
            # --target creates the tag at this commit when it does not already exist.
            gh release create "$tag" target/PrivacyCoords-*.jar \
              --target "$GITHUB_SHA" \
              --title "PrivacyCoords ${tag#v}" \
              --notes-file "$notes"
          fi
          gh release view "$tag"
