name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build plugin jar
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn -B -ntp clean package

      - name: Check the jar was shaded correctly
        run: |
          jar=$(ls target/PrivacyCoords-*.jar)
          echo "Built $jar"
          # The plugin's own classes, its plugin.yml and a relocated PacketEvents must all be in there.
          unzip -l "$jar" > contents.txt
          grep -q "dev/faboit/privacycoords/PrivacyCoordsPlugin.class" contents.txt
          grep -q "plugin.yml" contents.txt
          grep -q "config.yml" contents.txt
          grep -q "dev/faboit/privacycoords/libs/packetevents/" contents.txt
          # Nothing may still sit under the original PacketEvents package names.
          if grep -qE "^\s+[0-9]+.*(com|io)/github/retrooper/packetevents/" contents.txt; then
            echo "PacketEvents was not relocated"
            exit 1
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyCoords
          path: target/PrivacyCoords-*.jar
          if-no-files-found: error
