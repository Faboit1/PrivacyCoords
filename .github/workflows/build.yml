name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build plugin jar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn -B -ntp clean package

      - name: Inspect the shaded jar
        run: |
          set -euo pipefail
          jar=$(ls target/PrivacyCoords-*.jar)
          echo "Built $jar ($(du -h "$jar" | cut -f1))"
          unzip -l "$jar" > contents.txt

          fail() { echo "::error::$1"; exit 1; }

          # The plugin's own classes and resources have to be there.
          grep -q "dev/faboit/privacycoords/PrivacyCoordsPlugin.class" contents.txt \
            || fail "the plugin's main class is missing from the jar"
          grep -q " config.yml$" contents.txt || fail "config.yml is missing from the jar"

          # The plugin.yml in the jar must be ours - PacketEvents ships one too, and if its
          # copy won the merge the server would try to load the wrong plugin entirely.
          unzip -p "$jar" plugin.yml > plugin.yml.built
          grep -q "^main: dev.faboit.privacycoords.PrivacyCoordsPlugin$" plugin.yml.built \
            || { echo "--- plugin.yml in the jar ---"; cat plugin.yml.built; fail "plugin.yml is not ours"; }
          grep -q "^name: PrivacyCoords$" plugin.yml.built || fail "plugin.yml name was not filtered in"

          # Folia and its forks refuse to load a plugin that has not declared this.
          grep -q "^folia-supported: true$" plugin.yml.built \
            || fail "plugin.yml does not declare folia-supported, so Folia/Canvas will not load it"

          # PacketEvents must be present, and only under the relocated package.
          grep -q "dev/faboit/privacycoords/libs/packetevents/" contents.txt \
            || fail "the relocated PacketEvents is missing from the jar"
          ! grep -qE "(com|io)/github/retrooper/packetevents/" contents.txt \
            || fail "PacketEvents was not relocated"

          # Things the server owns must not be duplicated inside a plugin jar. A bundled netty
          # would shadow the pipeline PacketEvents hooks into; a bundled adventure clashes with
          # Paper's own copy.
          ! grep -qE "^\s+[0-9]+.*\sio/netty/" contents.txt || fail "netty was bundled into the jar"
          ! grep -qE "^\s+[0-9]+.*\snet/kyori/adventure/(text/(Component|serializer/plain)|key)/" contents.txt \
            || fail "adventure core was bundled into the jar"

          echo "Jar contents look right."

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: PrivacyCoords
          path: target/PrivacyCoords-*.jar
          if-no-files-found: error
